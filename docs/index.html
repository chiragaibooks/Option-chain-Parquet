<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NIFTY50 Option Chain Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#222;font-size:13px}
.nav{background:#fff;border-bottom:1px solid #e0e0e0;padding:0 20px;height:50px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.logo{font-size:17px;font-weight:800;color:#00b386}
.updated{margin-left:auto;font-size:11px;color:#aaa}
.wrap{max-width:1400px;margin:0 auto;padding:16px 20px}
.bar{background:#fff;border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;border:1px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.bar label{font-size:12px;color:#555;font-weight:600}
.bar select{padding:6px 10px;border:1px solid #bbb;border-radius:6px;font-size:13px;outline:none;background:#fff;min-width:140px;cursor:pointer}
.bar select:focus{border-color:#00b386}
.spot-pill{background:#e6f7f1;color:#00b386;font-weight:700;padding:5px 12px;border-radius:20px;font-size:13px}
.atm-pill{background:#fff3cd;color:#b45309;font-weight:700;padding:5px 12px;border-radius:20px;font-size:13px}
.oc-box{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden}
.oc-scroll{overflow-x:auto}
table.oc{width:100%;border-collapse:collapse;font-size:12px}
table.oc thead th{padding:7px 8px;text-align:center;font-weight:600;color:#666;background:#fafafa;border-bottom:2px solid #eee;white-space:nowrap}
table.oc thead th.ch{color:#00b386}
table.oc thead th.ph{color:#e74c3c}
table.oc thead th.sh{background:#f0f0f0;color:#333}
table.oc tbody tr{border-bottom:1px solid #f5f5f5;transition:background .1s}
table.oc tbody tr:hover{background:#f9fffe}
table.oc tbody td{padding:5px 8px;text-align:right;white-space:nowrap}
table.oc tbody td.sc{text-align:center;font-weight:700;background:#fafafa;border-left:1px solid #eee;border-right:1px solid #eee}
table.oc tbody tr.atm-row td{background:#fffbea!important}
table.oc tbody tr.atm-row td.sc{background:#fff3cd!important;color:#b45309}
.atm-tag{background:#f59e0b;color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.bar-wrap{display:flex;align-items:center;gap:3px}
.oi-bar{height:5px;border-radius:3px;min-width:1px}
.oi-bar.c{background:#00b386}
.oi-bar.p{background:#e74c3c}
td.c-oi{color:#00b386}
td.p-oi{color:#e74c3c}
.loader{text-align:center;padding:48px;color:#aaa;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #eee;border-top-color:#00b386;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:#aaa}
.err{color:#e74c3c;padding:20px;text-align:center}
</style>
</head>
<body>

<nav class="nav">
  <div class="logo">📈 NIFTY50 Option Chain</div>
  <div class="updated" id="updated-ts">Loading...</div>
</nav>

<div class="wrap">
  <div class="bar">
    <div><label>Snapshot &nbsp;</label>
      <select id="sel-snapshot" onchange="onSnapshotChange()">
        <option>Loading...</option>
      </select>
    </div>
    <div><label>Expiry &nbsp;</label>
      <select id="sel-expiry" onchange="render()">
        <option>—</option>
      </select>
    </div>
    <div><label>Type &nbsp;</label>
      <select id="sel-type" onchange="render()">
        <option value="">All</option>
        <option value="CE">CE only</option>
        <option value="PE">PE only</option>
      </select>
    </div>
    <div id="spot-badge" class="spot-pill" style="display:none"></div>
    <div id="atm-badge"  class="atm-pill"  style="display:none"></div>
  </div>

  <div class="oc-box" id="oc-box">
    <div class="loader"><span class="spin"></span>Loading data...</div>
  </div>
</div>

<script>
let _data = null;   // full data.json payload
let _snap = null;   // currently selected snapshot object

// ── Load data.json ────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('data.json?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _data = await r.json();
  } catch (e) {
    document.getElementById('oc-box').innerHTML =
      '<div class="err">⚠️ Could not load data.json: ' + e.message +
      '<br><small>Make sure the GitHub Actions workflow has run at least once.</small></div>';
    return;
  }

  document.getElementById('updated-ts').textContent = 'Updated: ' + (_data.updated || '—');

  const snaps = _data.snapshots || [];
  if (!snaps.length) {
    document.getElementById('oc-box').innerHTML = '<div class="empty">No snapshots yet.</div>';
    return;
  }

  const sel = document.getElementById('sel-snapshot');
  sel.innerHTML = snaps.map((s, i) =>
    `<option value="${i}">${s.label}</option>`
  ).join('');

  selectSnapshot(0);
}

// ── Snapshot change ───────────────────────────────────────────
function onSnapshotChange() {
  selectSnapshot(+document.getElementById('sel-snapshot').value);
}

function selectSnapshot(idx) {
  _snap = (_data.snapshots || [])[idx];
  if (!_snap) return;

  // Populate expiry dropdown
  const expSel = document.getElementById('sel-expiry');
  expSel.innerHTML = _snap.expiries.map(e =>
    `<option value="${e}">${e}</option>`
  ).join('');

  render();
}

// ── Render table ──────────────────────────────────────────────
function render() {
  if (!_snap) return;

  const expiry   = document.getElementById('sel-expiry').value;
  const typeFilter = document.getElementById('sel-type').value;
  const spot     = _snap.spot;
  const gap      = 50;
  const atm      = spot ? Math.round(spot / gap) * gap : null;

  // Update badges
  const spotBadge = document.getElementById('spot-badge');
  const atmBadge  = document.getElementById('atm-badge');
  if (spot) {
    spotBadge.textContent = 'Spot: ' + f2(spot);
    spotBadge.style.display = '';
    atmBadge.textContent  = 'ATM: ' + atm;
    atmBadge.style.display = '';
  } else {
    spotBadge.style.display = atmBadge.style.display = 'none';
  }

  // Filter rows
  let rows = (_snap.rows || []).filter(r => r.expiry === expiry);
  if (!rows.length) {
    document.getElementById('oc-box').innerHTML = '<div class="empty">No data for this expiry.</div>';
    return;
  }

  const maxOI = Math.max(...rows.map(r =>
    Math.max(r.CE?.oi || 0, r.PE?.oi || 0)
  ), 1);

  // Build table rows
  const showCE = typeFilter !== 'PE';
  const showPE = typeFilter !== 'CE';

  const tbody = rows.map(r => {
    const isAtm = atm !== null && r.strike === atm;
    const ce = r.CE || {}, pe = r.PE || {};
    const cw = Math.round((ce.oi || 0) / maxOI * 50);
    const pw = Math.round((pe.oi || 0) / maxOI * 50);

    if (typeFilter === 'CE') {
      return `<tr class="${isAtm ? 'atm-row' : ''}">
        <td class="c-oi"><div class="bar-wrap" style="justify-content:flex-end">
          <span>${fi(ce.oi)}</span><div class="oi-bar c" style="width:${cw}px"></div>
        </div></td>
        <td>${fi(ce.oiChg)}</td>
        <td>${fi(ce.volume)}</td>
        <td>${fp(ce.iv)}</td>
        <td><b>${f2(ce.ltp)}</b></td>
        <td>${f2(ce.delta)}</td><td>${f2(ce.theta)}</td><td>${f2(ce.vega)}</td>
        <td class="sc">${r.strike}${isAtm ? '<span class="atm-tag">ATM</span>' : ''}</td>
      </tr>`;
    }
    if (typeFilter === 'PE') {
      return `<tr class="${isAtm ? 'atm-row' : ''}">
        <td class="sc">${r.strike}${isAtm ? '<span class="atm-tag">ATM</span>' : ''}</td>
        <td>${f2(pe.delta)}</td><td>${f2(pe.theta)}</td><td>${f2(pe.vega)}</td>
        <td><b>${f2(pe.ltp)}</b></td>
        <td>${fp(pe.iv)}</td>
        <td>${fi(pe.volume)}</td>
        <td>${fi(pe.oiChg)}</td>
        <td class="p-oi"><div class="bar-wrap">
          <div class="oi-bar p" style="width:${pw}px"></div><span>${fi(pe.oi)}</span>
        </div></td>
      </tr>`;
    }
    // Both
    return `<tr class="${isAtm ? 'atm-row' : ''}">
      <td class="c-oi"><div class="bar-wrap" style="justify-content:flex-end">
        <span>${fi(ce.oi)}</span><div class="oi-bar c" style="width:${cw}px"></div>
      </div></td>
      <td>${fi(ce.oiChg)}</td>
      <td>${fi(ce.volume)}</td>
      <td>${fp(ce.iv)}</td>
      <td><b>${f2(ce.ltp)}</b></td>
      <td>${f2(ce.delta)}</td><td>${f2(ce.theta)}</td><td>${f2(ce.vega)}</td>
      <td class="sc">${r.strike}${isAtm ? '<span class="atm-tag">ATM</span>' : ''}</td>
      <td>${f2(pe.delta)}</td><td>${f2(pe.theta)}</td><td>${f2(pe.vega)}</td>
      <td><b>${f2(pe.ltp)}</b></td>
      <td>${fp(pe.iv)}</td>
      <td>${fi(pe.volume)}</td>
      <td>${fi(pe.oiChg)}</td>
      <td class="p-oi"><div class="bar-wrap">
        <div class="oi-bar p" style="width:${pw}px"></div><span>${fi(pe.oi)}</span>
      </div></td>
    </tr>`;
  }).join('');

  // Build header
  const ceHead = showCE ? `
    <th class="ch">OI</th><th class="ch">ΔOI</th><th class="ch">Vol</th>
    <th class="ch">IV%</th><th class="ch">LTP</th>
    <th class="ch">Δ</th><th class="ch">Θ</th><th class="ch">ν</th>` : '';
  const peHead = showPE ? `
    <th class="ph">Δ</th><th class="ph">Θ</th><th class="ph">ν</th>
    <th class="ph">LTP</th><th class="ph">IV%</th>
    <th class="ph">Vol</th><th class="ph">ΔOI</th><th class="ph">OI</th>` : '';
  const ceSpan = showCE ? `<th class="ch" colspan="8">── CALL (CE) ──</th>` : '';
  const peSpan = showPE ? `<th class="ph" colspan="8">── PUT (PE) ──</th>` : '';

  document.getElementById('oc-box').innerHTML = `
    <div class="oc-scroll">
      <table class="oc">
        <thead>
          <tr>${ceSpan}<th class="sh">STRIKE</th>${peSpan}</tr>
          <tr>${ceHead}<th class="sh">Strike</th>${peHead}</tr>
        </thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;

  // Scroll ATM into view
  setTimeout(() => {
    const atmRow = document.querySelector('tr.atm-row');
    if (atmRow) atmRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 100);
}

// ── Formatters ────────────────────────────────────────────────
const f2 = v => v == null ? '—' : Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fi = v => v == null ? '—' : Number(v).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const fp = v => v == null ? '—' : Number(v).toFixed(2) + '%';

// ── Boot ──────────────────────────────────────────────────────
init();
</script>
</body>
</html>
