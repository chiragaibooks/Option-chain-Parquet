name: Stock Data Cronjob

on:
  schedule:
    # Trigger once at market open and once mid-session to handle runner restarts
    # Each run loops internally for ~75 min, covering the full session with 2 triggers
    - cron: "14 3 * * 1-5"   # 03:14 UTC = 08:44 IST (pre-market, loop runs until ~10:00 UTC)
    - cron: "29 6 * * 1-5"   # 06:29 UTC = 11:59 IST (mid-session backup trigger)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: option-chain-run
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run per-minute loop
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import subprocess, sys, time
          from datetime import datetime
          import pytz

          IST = pytz.timezone("Asia/Kolkata")

          def is_market_open():
              now = datetime.now(IST)
              if now.weekday() >= 5:
                  return False
              hm = now.hour * 100 + now.minute
              return 915 <= hm <= 1530

          def git_sync():
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "add", "data/option_chain.db", "data/market_data.db", "README.md"], check=False)
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode != 0:
                  now_str = datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
                  subprocess.run(["git", "commit", "-m", f"chore: auto-update {now_str}"], check=False)
                  subprocess.run(["git", "push", "origin", "main"], check=False)

          print("Loop started", flush=True)
          while True:
              now = datetime.now(IST)
              if not is_market_open():
                  hm = now.hour * 100 + now.minute
                  if hm > 1530:
                      print(f"[{now.strftime('%H:%M IST')}] Market closed — exiting loop", flush=True)
                      break
                  print(f"[{now.strftime('%H:%M IST')}] Waiting for market open...", flush=True)
                  time.sleep(30)
                  continue

              print(f"[{now.strftime('%H:%M:%S IST')}] Running pipeline...", flush=True)
              subprocess.run([sys.executable, "-m", "src.main"])
              git_sync()

              # Sleep until next minute boundary
              elapsed = datetime.now(IST).second
              time.sleep(max(60 - elapsed, 1))
          EOF
