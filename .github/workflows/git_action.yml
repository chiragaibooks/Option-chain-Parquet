name: Option Chain Per-Minute Collector

# Triggered every minute by an external cron service (cron-job.org) via
# workflow_dispatch. Each run does ONE fetch + push, then exits.
# This single-shot design avoids long-running jobs that GitHub kills mid-day.

on:
  workflow_dispatch:
  # Backup schedule in case the external cron service misses a minute.
  # UTC times; market 09:15-15:30 IST = 03:45-10:00 UTC. Runs every 5 min.
  schedule:
    - cron: "*/5 3-10 * * 1-5"

# Allow runs to overlap slightly, but cancel a stuck previous run so a new
# minute's fetch always gets a fresh runner.
concurrency:
  group: option-chain-collector
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # single fetch — must finish fast

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt pyarrow

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch one snapshot
        run: python collect.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stage only what exists (parquet data + README)
          git add -f data/*.parquet || true
          git add README.md || true

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "chore: auto-update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin main; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying in 8s..."
            sleep 8
          done
          echo "ERROR: all push attempts failed" >&2
          exit 1
