name: Stock Data Cronjob

on:
  schedule:
    - cron: "*/1 3-10 * * 1-5"   # every minute, 08:30-16:30 UTC = 14:00-22:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: option-chain-run
      cancel-in-progress: false   # queue runs, don't cancel — every snapshot matters

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Pull latest DB before pipeline
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Run pipeline
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -m src.main

      - name: Commit changes
        run: |
          git add README.md data/market_data.db data/option_chain.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to commit"
          fi
