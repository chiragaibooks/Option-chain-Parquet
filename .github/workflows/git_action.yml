name: Stock Data Cronjob

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"   # every 5 min, 08:30-16:30 UTC = 14:00-22:00 IST; loop inside for per-minute snapshots
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: option-chain-run
      cancel-in-progress: false   # queue runs, don't cancel — every snapshot matters

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Pull latest DB before pipeline
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Run pipeline (5 fetches x 1 min apart)
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            echo "--- Fetch $i at $(date -u '+%H:%M:%S UTC') ---"
            python -m src.main
            if [ $i -lt 5 ]; then sleep 60; fi
          done

      - name: Commit changes
        run: |
          git add README.md data/option_chain.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to commit"
          fi
