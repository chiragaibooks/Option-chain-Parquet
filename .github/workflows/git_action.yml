name: Stock Data Cronjob

on:
  schedule:
    # Every 1 min, Mon-Fri, 03:30-10:00 UTC = 09:00-15:30 IST
    # 1 fetch per run — no inner loop. Startup (~2 min) + 1 fetch (~30s) = ~2.5 min per run.
    # concurrency queues overlapping runs so no snapshot is ever dropped.
    # GitHub cron minimum is */1 — gives true per-minute snapshots.
    - cron: "*/1 3-9 * * 1-5"   # 03:00-09:59 UTC = 08:30-15:29 IST
    - cron: "0 10 * * 1-5"       # 10:00 UTC = 15:30 IST (final snapshot)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: option-chain-run
      cancel-in-progress: false   # queue runs — never drop a snapshot

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Pull latest DB before pipeline
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Run pipeline (1 fetch per trigger)
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          echo "--- Fetch at $(date -u '+%H:%M:%S UTC') ---"
          python -m src.main

      - name: Commit changes
        run: |
          git add README.md data/option_chain.db data/market_data.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to commit"
          fi
