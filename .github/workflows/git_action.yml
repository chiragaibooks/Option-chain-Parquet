name: Option Chain Per-Minute Collector

# Triggered every minute by an external cron service (cron-job.org) via
# workflow_dispatch. Each run does ONE fetch + push, then exits.
# This single-shot design avoids long-running jobs that GitHub kills mid-day.

on:
  workflow_dispatch:
  # Backup schedule in case the external cron service misses a minute.
  # UTC times; market 09:15-15:30 IST = 03:45-10:00 UTC. Runs every 5 min.
  schedule:
    - cron: "*/5 3-10 * * 1-5"

# Allow runs to overlap slightly, but cancel a stuck previous run so a new
# minute's fetch always gets a fresh runner.
concurrency:
  group: option-chain-collector
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # single fetch — must finish fast

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt pyarrow

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch one snapshot and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import subprocess, sys
          from datetime import datetime
          import pytz

          IST = pytz.timezone("Asia/Kolkata")
          now = datetime.now(IST)
          m   = now.hour * 60 + now.minute

          MARKET_OPEN  = 9 * 60 + 15    # 09:15 IST
          MARKET_CLOSE = 15 * 60 + 30   # 15:30 IST

          # Skip weekends and anything outside market hours — nothing to fetch.
          if now.weekday() >= 5:
              print(f"[{now.strftime('%a %H:%M IST')}] Weekend — skipping", flush=True)
              sys.exit(0)
          if not (MARKET_OPEN <= m <= MARKET_CLOSE):
              print(f"[{now.strftime('%H:%M IST')}] Outside market hours — skipping", flush=True)
              sys.exit(0)

          print(f"[{now.strftime('%H:%M:%S IST')}] Fetching snapshot...", flush=True)
          try:
              subprocess.run([sys.executable, "-m", "src.fetch_option_chain"], timeout=120, check=False)
          except Exception as e:
              print(f"Fetch error: {e}", flush=True)

          # Regenerate README + dashboard data from the parquet files
          subprocess.run([sys.executable, "-m", "src.readme_generator"], timeout=60, check=False)
          subprocess.run([sys.executable, "-m", "src.dashboard_generator"], timeout=60, check=False)

          # Stage, commit, push (with rebase retries for concurrent runs)
          subprocess.run("git add -f data/*.parquet", shell=True, check=False)
          subprocess.run(["git", "add", "README.md"], check=False)
          subprocess.run(["git", "add", "docs/data.json"], check=False)

          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Nothing to commit", flush=True)
              sys.exit(0)

          now_str = datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
          subprocess.run(["git", "commit", "-m", f"chore: auto-update {now_str}"], check=False)

          import time
          for attempt in range(6):
              subprocess.run(["git", "fetch", "origin", "main"], check=False)
              subprocess.run(["git", "rebase", "origin/main"], check=False)
              r = subprocess.run(["git", "push", "origin", "main"], capture_output=True)
              if r.returncode == 0:
                  print("Pushed successfully", flush=True)
                  break
              print(f"Push failed (attempt {attempt+1}), retrying in 8s...", flush=True)
              subprocess.run(["git", "rebase", "--abort"], check=False)
              time.sleep(8)
          EOF
