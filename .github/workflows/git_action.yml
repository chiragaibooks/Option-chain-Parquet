name: Stock Data Cronjob

on:
  schedule:
    # 3 triggers x 90 min each = full 9:15-15:30 IST session covered
    - cron: "14 3 * * 1-5"   # 03:14 UTC = 08:44 IST  → covers 09:15-10:44 IST
    - cron: "14 5 * * 1-5"   # 05:14 UTC = 10:44 IST  → covers 10:44-12:14 IST
    - cron: "14 7 * * 1-5"   # 07:14 UTC = 12:44 IST  → covers 12:44-15:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: option-chain-run
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run per-minute loop
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import subprocess, sys, time
          from datetime import datetime
          import pytz

          IST = pytz.timezone("Asia/Kolkata")

          def is_market_open():
              now = datetime.now(IST)
              if now.weekday() >= 5:
                  return False
              hm = now.hour * 100 + now.minute
              return 915 <= hm <= 1530

          def git_sync():
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "add", "data/option_chain.db", "README.md"], check=False)
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode != 0:
                  now_str = datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
                  subprocess.run(["git", "commit", "-m", f"chore: auto-update {now_str}"], check=False)
                  subprocess.run(["git", "push", "origin", "main"], check=False)

          import threading

          def run_and_sync():
              subprocess.run([sys.executable, "-m", "src.fetch_option_chain"])
              subprocess.run([sys.executable, "-m", "src.readme_generator"])
              git_sync()

          print("Loop started", flush=True)
          while True:
              now = datetime.now(IST)
              if not is_market_open():
                  hm = now.hour * 100 + now.minute
                  if hm > 1530:
                      print(f"[{now.strftime('%H:%M IST')}] Market closed — exiting loop", flush=True)
                      break
                  print(f"[{now.strftime('%H:%M IST')}] Waiting for market open...", flush=True)
                  time.sleep(30)
                  continue

              print(f"[{now.strftime('%H:%M:%S IST')}] Running pipeline...", flush=True)
              t = threading.Thread(target=run_and_sync, daemon=True)
              t.start()

              # Sleep 120s for 2-minute interval
              time.sleep(120)
              t.join()  # wait for previous run to finish before starting next
          EOF
