name: Stock Data Cronjob

on:
  schedule:
    # Trigger early so runner delay doesn't cause missed 9:15 start
    - cron: "30 3 * * 1-5"   # 03:30 UTC = 09:00 IST (15 min buffer before market open)
  workflow_dispatch:

concurrency:
  group: stock-data-cronjob
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 400

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt pyarrow

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run per-minute loop
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import subprocess, sys, time
          from datetime import datetime
          import pytz

          IST = pytz.timezone("Asia/Kolkata")
          INTERVAL = 60  # seconds between runs

          def git_sync():
              subprocess.run(["git", "rm", "--cached", "data/option_chain.db"], check=False, capture_output=True)
              subprocess.run(["git", "add", "-f", "data/*.parquet"], check=False)
              subprocess.run(["git", "add", "README.md"], check=False)
              result = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if result.returncode != 0:
                  now_str = datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
                  subprocess.run(["git", "commit", "-m", f"chore: auto-update {now_str}"], check=False)
              for _ in range(5):
                  subprocess.run(["git", "fetch", "origin", "main"], check=False)
                  subprocess.run(["git", "rebase", "origin/main"], check=False)
                  r = subprocess.run(["git", "push", "origin", "main"], capture_output=True)
                  if r.returncode == 0:
                      break
                  print("Push failed, retrying in 10s...", flush=True)
                  subprocess.run(["git", "rebase", "--abort"], check=False)
                  time.sleep(10)

          def rollover_db_if_large():
              import os, shutil
              db = "data/option_chain.db"
              if not os.path.exists(db):
                  return
              size_mb = os.path.getsize(db) / (1024 * 1024)
              if size_mb >= 90:
                  today = datetime.now(IST).strftime("%Y%m%d")
                  archive = f"data/option_chain_{today}.db"
                  shutil.move(db, archive)
                  print(f"DB reached {size_mb:.1f}MB — archived to {archive}", flush=True)

          def flush_parquet_and_sync():
              from src.database import flush_day_to_parquet
              flush_day_to_parquet("data/option_chain.db", datetime.now(IST))
              git_sync()

          def run_and_sync():
              rollover_db_if_large()
              subprocess.run([sys.executable, "-m", "src.fetch_option_chain"], timeout=90)
              flush_parquet_and_sync()  # flush parquet every minute so it's always current
              subprocess.run([sys.executable, "-m", "src.readme_generator"], timeout=30)
              subprocess.run([sys.executable, "-m", "src.dashboard_generator"], timeout=30)
              git_sync()

          print("Loop started", flush=True)
          now = datetime.now(IST)
          if now.weekday() >= 5:
              print(f"[{now.strftime('%H:%M IST')}] Weekend — nothing to do", flush=True)
              sys.exit(0)

          while True:
              now = datetime.now(IST)
              hm  = now.hour * 100 + now.minute
              if hm > 1530:
                  print(f"[{now.strftime('%H:%M IST')}] Market closed — flushing parquet", flush=True)
                  flush_parquet_and_sync()
                  break
              if hm < 915:
                  wait = (9 * 60 + 15 - now.hour * 60 - now.minute) * 60 - now.second
                  print(f"[{now.strftime('%H:%M IST')}] Pre-market, sleeping {wait}s until 9:15", flush=True)
                  time.sleep(max(wait, 0))
                  continue

              next_run = time.monotonic() + INTERVAL
              print(f"[{now.strftime('%H:%M:%S IST')}] Running pipeline...", flush=True)
              try:
                  run_and_sync()
              except Exception as e:
                  print(f"Pipeline error: {e}", flush=True)

              sleep_for = next_run - time.monotonic()
              if sleep_for > 0:
                  time.sleep(sleep_for)
          EOF
